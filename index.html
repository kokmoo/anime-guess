<div class="ov" id="dlg" style="z-index:30"><div class="box" style="width:100%;max-width:380px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)" id="dc"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const CARDS={world:['🗺️','ใบ้โลก'],letter:['🔎','เปิดตัวอักษร'],era:['📅','ใบ้ยุค'],ability:['⚡','ความสามารถ'],side:['🏴','ฝ่าย'],role:['⭐','บทบาท']};
const s=io(),$=id=>document.getElementById(id);
const pid=sessionStorage.pid||(sessionStorage.pid=Math.random().toString(36).slice(2));
const VER=4;let chatMsgs=[],unread=0,chatOpen=false;let QM=null,st=null,animes=[],chars=[],libQ='',name=localStorage.name||'',mode='home',t0=0,lastKey='',lastSec=-1,sound=localStorage.snd!=='0';
const pre=new URLSearchParams(location.search).get('room')||'';
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss=ms=>{const t=Math.ceil(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const av=n=>`<span class="av" style="background:hsl(${[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360} 85% 65%)">${esc([...n][0]||'?')}</span>`;
// ---- sound (synthesized, no files) ----
let ac;
function tone(f,d=.12,type='square',v=.07,t=0){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const seq=(a,type,d,v)=>a.forEach((f,i)=>tone(f,d,type,v,i*.1));
const slide=(a,b,d=.2,type='sawtooth',v=.07,t=0)=>{if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.type=type;o.frequency.setValueAtTime(a,n);o.frequency.exponentialRampToValueAtTime(b,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}};
const R=a=>a[Math.floor(Math.random()*a.length)];
const CS={world:()=>{slide(200,800,.35,'sine',.1);seq([523,659,784],'triangle',.2,.08)},letter:()=>seq([1319,1568,1319,1760],'square',.08,.05),era:()=>{tone(262,.5,'sine',.12);tone(392,.5,'sine',.1,.12);tone(523,.6,'sine',.08,.24)},ability:()=>{slide(150,1200,.3,'sawtooth',.07);tone(1500,.15,'square',.05,.3)},side:()=>{tone(330,.15,'triangle',.1);tone(247,.15,'triangle',.1,.15);tone(330,.3,'triangle',.1,.3)},role:()=>seq([784,988,1175,1568],'triangle',.2,.09)};
const SFX={click:()=>tone(R([560,620,700,780]),.06),tick:c=>tone(500+(10-(c||5))*70,.06,'square',.05),beep:()=>tone(520,.15,'triangle',.1),go:()=>seq([392,523,659,784,1047],'sawtooth',.2,.07),card:t=>(CS[t]||CS.world)(),hint:()=>seq([1047,1319,1568],'sine',.25,.09),ready:()=>seq([659,988],'triangle',.15,.1),leave:()=>slide(600,150,.35,'triangle',.09),err:()=>{tone(150,.2,'sawtooth',.09);tone(120,.25,'sawtooth',.09,.15)},final:()=>[0,1,2].forEach(i=>{tone(880,.12,'square',.07,i*.25);tone(660,.12,'square',.07,i*.25+.12)}),win:()=>seq([523,659,784,1047,1319],'triangle',.22,.12),lose:()=>seq([392,330,262,196],'sawtooth',.28,.08),reveal:()=>{slide(R([200,260,330]),R([700,900,1100]),.3,'triangle',.09);tone(R([880,988,1175]),.2,'triangle',.08,.2)},join:()=>seq([740,988],'triangle',.12,.09),yes:()=>seq([880,1175],'triangle',.1,.09),no:()=>slide(420,180,.22,'sawtooth',.07),msg:()=>seq([1319,1760],'sine',.08,.06),pop:()=>tone(R([660,880,990]),.1,'triangle',.07)};
document.addEventListener('click',e=>{const t=e.target.closest('button,.card');if(t){SFX.click();t.classList.remove('squish');void t.offsetWidth;t.classList.add('squish')}});
function confetti(){for(let i=0;i<50;i++){const d=document.createElement('i');d.textContent=['🎉','✨','⭐','🎊'][i%4];d.style.cssText=`position:fixed;top:-30px;left:${Math.random()*100}vw;font-size:${18+Math.random()*18}px;z-index:20;pointer-events:none;animation:fall ${2+Math.random()*2}s linear forwards`;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}}
// ---- network ----
s.on('meta',m=>{animes=m.animes;chars=m.chars||[];if(m.v!==VER)warn();if(sessionStorage.room)s.emit('join',{code:sessionStorage.room,name,pid})});
s.on('state',x=>{
 const k=JSON.stringify({...x,left:0}),same=st&&k===lastKey,o=st;lastKey=k;st=x;t0=Date.now();sessionStorage.room=x.code;
 if(!o||o.code!==x.code){chatMsgs=[];act('getchat')}
 if(same)return;
 if(libLocked())closeLib();
 if(o){
  const a=o.players.find(p=>p.pid===x.you),b=x.players.find(p=>p.pid===x.you);
  if(a&&b&&!a.res&&b.res){if(b.res==='win'){SFX.win();confetti()}else SFX.lose()}
  if(o.players.length<x.players.length)SFX.join();else if(o.players.length>x.players.length)SFX.leave();
  if(x.phase==='brief'&&o.phase==='brief'&&x.players.filter(p=>p.ready).length>o.players.filter(p=>p.ready).length)SFX.ready();
  if(nAns(x)>nAns(o))setTimeout(SFX.hint,300);
  if(o.phase!==x.phase){
   if(x.phase==='play'){SFX.go();noteReset()}if(x.phase==='final')SFX.final();
   if(x.phase==='over'){confetti();x.players.forEach((_,i)=>setTimeout(SFX.reveal,i*500))}
  }
  if(x.turn===x.you&&o.turn!==x.you){SFX.beep();navigator.vibrate&&navigator.vibrate(150)}
 }
 render()});
s.on('err',m=>{if(!st)sessionStorage.removeItem('room');SFX.err();say(m)});
s.on('toast',({name,type,q})=>{SFX.card(type);$('tt').innerHTML=`<div style="font-size:60px">${CARDS[type][0]}</div>${esc(name)}<br>ใช้การ์ด “${CARDS[type][1]}”<div style="font-size:18px;font-weight:600;margin-top:12px;background:#fff;color:#14142b;border:3px solid var(--line);padding:8px 12px">❓ ${esc(q||'')}<br><small>เพื่อนๆ ช่วยตอบหน่อย!</small></div>`;showToast(3800)});
setInterval(()=>{if(!st||!st.left)return;const l=Math.max(0,st.left-(Date.now()-t0)),e=$('tm');
 if(e&&st.phase!=='countdown'){e.textContent=mmss(l);e.className='timer'+(l<=10000?' low':'')}
 if(st.phase==='play'&&l>0&&l<=10000){const c=Math.ceil(l/1000);if(c!==lastSec){lastSec=c;SFX.tick(c)}}},250);
let _res;
function dlg(html,btns){return new Promise(r=>{_res=r;$('dc').innerHTML=`<div style="font-size:18px;margin-bottom:10px;line-height:1.5">${html}</div>`+btns.map((b,i)=>`<button class="${b[1]}" onclick="dlgDone(${i})">${b[0]}</button>`).join('');$('dlg').style.display='flex'})}
function dlgDone(i){$('dlg').style.display='none';_res(i)}

let QZ=null,QS=null,qTick=0;
const QT={scene:'🎬 ฉาก',char:'🧑 ตัวละคร',quote:'💬 คำพูด'},QLIM=20,QNUM=10;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const qBest=k=>{try{return+(JSON.parse(localStorage.qbest||'{}')[k]||0)}catch(e){return 0}};
const qSave=(k,v)=>{try{const o=JSON.parse(localStorage.qbest||'{}');if(v>(o[k]||0)){o[k]=v;localStorage.qbest=JSON.stringify(o)}}catch(e){}};
const qNames=()=>[...new Set((QZ||[]).map(q=>q.a))];
function quizHome(){mode='quiz';QS=null;clearInterval(qTick);render();if(!QZ)fetch('/quiz.json?v='+VER).then(r=>r.json()).then(j=>{QZ=Array.isArray(j)?j:[];if(mode==='quiz')render()}).catch(()=>{QZ=[];if(mode==='quiz')render()})}
function quizStart(i){
 const a=i<0?'ALL':qNames()[i],pool=QZ.filter(q=>a==='ALL'||q.a===a);if(!pool.length)return;
 QS={a,ai:i,qs:shuf(pool).slice(0,QNUM).map(q=>({...q,o:shuf([q.c,...q.w])})),i:0,score:0,ok:0,streak:0,picked:null,gain:0,t0:0};
 mode='quizPlay';render();qRun()}
function qRun(){clearInterval(qTick);QS.t0=Date.now();QS.picked=null;
 qTick=setInterval(()=>{if(!QS||mode!=='quizPlay'||QS.picked!==null){clearInterval(qTick);return}
  const left=Math.max(0,QLIM*1000-(Date.now()-QS.t0)),e=$('qt'),b=$('qbar');
  if(e){e.textContent=Math.ceil(left/1000);e.classList.toggle('low',left<=5000)}
  if(b)b.style.width=(left/(QLIM*10))+'%';
  if(left<=0)quizAnswer(-1)},200)}
function quizAnswer(i){
 if(!QS||QS.picked!==null)return;clearInterval(qTick);
 const q=QS.qs[QS.i],ok=i>=0&&q.o[i]===q.c;QS.picked=i;QS.gain=0;
 if(ok){const left=Math.max(0,QLIM*1000-(Date.now()-QS.t0));QS.streak++;QS.gain=100+Math.round(left/(QLIM*1000)*50)+(QS.streak>=3?20:0);QS.score+=QS.gain;QS.ok++;seq([523,659,784],'triangle',.12,.08)}
 else{QS.streak=0;tone(180,.3,'sawtooth',.08)}
 render()}
function quizNext(){
 if(QS.i+1>=QS.qs.length){mode='quizEnd';qSave(QS.a,QS.score);render();if(QS.ok>=QS.qs.length*.8)confetti();return}
 QS.i++;QS.picked=null;render();qRun()}
function drawQuiz(A){

 if(mode==='quiz'){

  if(!QZ.length){A.innerHTML=`<h2>🧠 โหมดแฟนพันธุ์แท้</h2><div class="box">โหลดคำถามไม่สำเร็จ ตรวจว่ามีไฟล์ quiz.json อยู่ข้าง index.html</div>${back}`;return}
  const nm=qNames();
  A.innerHTML=`<h2>🧠 โหมดแฟนพันธุ์แท้</h2><div class="box"><p style="margin-top:0;line-height:1.6">ตอบคำถามเกี่ยวกับฉาก ตัวละคร และคำพูดจากอนิเมะที่คุณรัก ข้อละ ${QLIM} วินาที ตอบเร็วได้คะแนนเพิ่ม ตอบถูกติดกันได้โบนัส 🔥</p>
   <button class="b" onclick="quizStart(-1)">🎲 สุ่มจากทุกเรื่อง <small>(${QZ.length} ข้อ${qBest('ALL')?` · สถิติ ${qBest('ALL')}`:''})</small></button>
   ${nm.map((n,i)=>{const c=QZ.filter(q=>q.a===n).length,b=qBest(n);return `<button class="g" onclick="quizStart(${i})">${esc(n)} <small>(${c} ข้อ${b?` · สถิติ ${b}`:''})</small></button>`}).join('')}</div>${mpBox()}${back}`;return}
 if(mode==='quizPlay'&&QS){
  const q=QS.qs[QS.i],done=QS.picked!==null,ok=done&&QS.picked>=0&&q.o[QS.picked]===q.c;
  A.innerHTML=`<div class="row"><b>${QS.a==='ALL'?'ทุกเรื่อง':esc(QS.a)}</b><small>ข้อ ${QS.i+1}/${QS.qs.length} · ⭐ ${QS.score}${QS.streak>=2?` · 🔥x${QS.streak}`:''}</small></div>
  <div class="qbar"><i id="qbar" style="width:${done?0:100}%"></i></div>
  <div class="box"><div class="row"><small>${QT[q.t]||''} · ${esc(q.a)}</small><b class="q" id="qt">${done?'':QLIM}</b></div>
  ${qmImg(q)}<p style="font-size:20px;font-weight:600;line-height:1.5">${esc(q.q)}</p>
  ${q.o.map((o,i)=>`<button class="opt g ${done?(o===q.c?'ok':(i===QS.picked?'no':'')):''}" ${done?'disabled':''} onclick="quizAnswer(${i})">${esc(o)}</button>`).join('')}</div>
  ${done?`<div class="box"><b class="${ok?'win':'lose'}">${ok?'✅ ถูกต้อง! +'+QS.gain:QS.picked<0?'⏰ หมดเวลา':'❌ ตอบผิด'}</b><p style="line-height:1.6">${esc(q.e||'')}</p><button class="b" onclick="quizNext()">${QS.i+1<QS.qs.length?'ข้อต่อไป ▶':'ดูผลคะแนน 🏁'}</button></div>`:''}${back}`;return}
 if(mode==='quizEnd'&&QS){
  const n=QS.qs.length,p=QS.ok/n,rank=p===1?'👑 แฟนพันธุ์แท้ตัวจริง':p>=.8?'🔥 แฟนตัวยง':p>=.5?'🙂 แฟนทั่วไป':'🌱 แฟนมือใหม่';
  A.innerHTML=`<h2>🏁 สรุปผล — ${QS.a==='ALL'?'ทุกเรื่อง':esc(QS.a)}</h2><div class="box" style="text-align:center"><div class="big" style="font-size:72px">${QS.ok}/${n}</div><b style="font-size:24px">${rank}</b><p>คะแนนรวม ⭐ ${QS.score} · สถิติสูงสุด ${qBest(QS.a)}</p></div>
  <button class="b" onclick="quizStart(${QS.ai})">🔄 เล่นอีกครั้ง</button><button class="g" onclick="quizHome()">📚 เลือกเรื่องอื่น</button>${back}`;return}
 mode='quiz';drawQuiz(A)}

 <input id="qn" maxlength="16" value="${esc(name)}" placeholder="ชื่อของคุณ">
 <button class="b" onclick="qzCreate()">🏠 สร้างห้องแข่ง</button>
 <input id="qc" placeholder="รหัสห้อง เช่น A7K9P" value="${esc(pqroom)}" style="text-transform:uppercase">
 <button class="g" onclick="qzJoin()">🔑 เข้าร่วมห้อง</button></div>`;
s.on('qz:state',x=>{const was=QM&&QM.phase;QM=x;QM._t=Date.now();sessionStorage.qroom=x.code;mode='qm';render();qmRun();
 if(x.phase==='end'&&was!=='end')confetti();
 if(x.phase==='reveal'&&was!=='reveal'){if(x.mine===x.rev.ci)seq([523,659,784],'triangle',.12,.08);else tone(180,.3,'sawtooth',.08)}});
s.on('qz:err',m=>{if(!QM)sessionStorage.removeItem('qroom');say(m)});
s.on('meta',()=>{if(sessionStorage.qroom)s.emit('qz:join',{code:sessionStorage.qroom,name,pid})});
function qzName(){const n=$('qn').value.trim();if(!n){say('ใส่ชื่อก่อน');return ''}name=n;localStorage.name=n;return n}
function qzCreate(){const n=qzName();if(n)s.emit('qz:create',{name:n,pid})}
function qzJoin(){const n=qzName(),c=$('qc').value.trim();if(!n)return;if(!c)return say('ใส่รหัสห้อง');s.emit('qz:join',{code:c,name:n,pid})}
function qzSet(){s.emit('qz:set',{anime:$('qa').value,count:+$('qcn').value,time:+$('qtm').value,imgOnly:$('qio').checked})}
function qzAns(i){if(QM&&QM.phase==='q'&&QM.mine===null)s.emit('qz:answer',i)}
async function qzLeave(){if(!await ask('ออกจากห้องแข่งนี้?','ออกจากห้อง','r'))return;s.emit('qz:leave');QM=null;clearInterval(qmTick);sessionStorage.removeItem('qroom');mode='home';render()}
function qmRun(){clearInterval(qmTick);if(!QM||(QM.phase!=='q'&&QM.phase!=='reveal'))return;
 qmTick=setInterval(()=>{if(!QM){clearInterval(qmTick);return}const gone=Date.now()-QM._t;
  if(QM.phase==='q'){const left=Math.max(0,QM.q.left-gone),e=$('qmt'),b=$('qmbar');if(e){e.textContent=Math.ceil(left/1000);e.classList.toggle('low',left<=5000)}if(b)b.style.width=(left/(QM.q.time*10))+'%'}
  else{const e=$('qmn');if(e)e.textContent=Math.ceil(Math.max(0,QM.rev.nextIn-gone)/1000)}},200)}
function drawQM(A){
 A.className='';document.body.classList.remove('w');
 const me=QM.players.find(p=>p.pid===QM.you)||{score:0,delta:0},rank=[...QM.players].sort((a,b)=>b.score-a.score);
 const leaveBtn=`<button class="g" onclick="qzLeave()">🚪 ออกจากห้อง</button>`;
 const board=(rev)=>`<div class="box"><b>🏆 อันดับ</b>${rank.map((p,i)=>`<div class="pl">${av(p.name)}<span class="gr">${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(p.name)}${p.pid===QM.you?' (คุณ)':''}${p.pid===QM.ownerPid?' 👑':''}${p.online?'':' <small>(หลุด)</small>'}${p.streak>=3?' 🔥':''}${rev?(p.pick===QM.rev.ci?' ✅':p.pick===null?' ⏰':' ❌'):''}</span>${rev&&p.delta?`<small class="win">+${p.delta}</small>`:''}<b>${p.score}</b></div>`).join('')}</div>`;
 if(QM.phase==='lobby'){
  const S=QM.set,an=QM.animes||[],cur=an.find(a=>a.name===S.anime),all=S.anime==='ALL',tot=all?an.reduce((t,a)=>t+a.count,0):(cur?cur.count:0),im=all?an.reduce((t,a)=>t+a.img,0):(cur?cur.img:0);
  const opt=(arr,v)=>arr.map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('');
  A.innerHTML=`<h2>🧠 ห้องแฟนพันธุ์แท้</h2><div class="code">${esc(QM.code)}</div>
  <button class="g" onclick="copy(location.origin+'/?qroom='+QM.code)">🔗 คัดลอกลิงก์เชิญเพื่อน</button>
  <div class="box"><b>ผู้เล่น (${QM.players.length})</b>${QM.players.map(p=>`<div class="pl">${av(p.name)}<span class="gr">${esc(p.name)}${p.pid===QM.you?' (คุณ)':''}${p.pid===QM.ownerPid?' 👑':''}${p.online?'':' <small>(หลุด)</small>'}</span></div>`).join('')}</div>
  <div class="box"><b>ตั้งค่า</b>${QM.owner?`
   <select id="qa" onchange="qzSet()"><option value="ALL" ${all?'selected':''}>ทุกเรื่อง</option>${an.map(a=>`<option value="${esc(a.name)}" ${S.anime===a.name?'selected':''}>${esc(a.name)} (${a.count} ข้อ${a.img?` · 📷${a.img}`:''})</option>`).join('')}</select>
   จำนวนข้อ<select id="qcn" onchange="qzSet()">${opt([[10,'10 ข้อ'],[20,'20 ข้อ'],[30,'30 ข้อ'],[50,'50 ข้อ'],[100,'100 ข้อ'],[0,'ทั้งหมดในหมวด']],S.count)}</select>
   เวลาต่อข้อ<select id="qtm" onchange="qzSet()">${opt([[10,'10 วินาที'],[15,'15 วินาที'],[20,'20 วินาที'],[30,'30 วินาที']],S.time)}</select>
   <label class="c"><input type="checkbox" id="qio" ${S.imgOnly?'checked':''} onchange="qzSet()"> เฉพาะข้อที่มีรูป</label>`
   :`<p style="margin:6px 0">เรื่อง: <b>${all?'ทุกเรื่อง':esc(S.anime)}</b><br>จำนวน: <b>${S.count||'ทั้งหมด'}</b> ข้อ · เวลา: <b>${S.time}</b> วินาที${S.imgOnly?' · เฉพาะข้อที่มีรูป':''}</p>`}
   <small>มีคำถามในหมวดนี้ ${tot} ข้อ (มีรูป ${im} ข้อ) · ข้อที่ยังไม่เคยออกในห้องนี้จะมาก่อนเสมอ</small></div>
  ${QM.owner?'<button class="b hot" onclick="s.emit(\'qz:start\')">▶ เริ่มเกม</button>':'<p style="text-align:center">รอเจ้าของห้องกดเริ่ม…</p>'}${leaveBtn}`;return}
 if(QM.phase==='q'||QM.phase==='reveal'){
  const q=QM.q,rv=QM.phase==='reveal',ans=QM.mine!==null,left=Math.max(0,q.left-(Date.now()-QM._t)),ac=QM.players.filter(p=>p.answered).length,on=QM.players.filter(p=>p.online).length,ok=rv&&QM.mine===QM.rev.ci;
  A.innerHTML=`<div class="row"><b>${esc(q.a)}</b><small>ข้อ ${QM.i+1}/${QM.n} · ⭐ ${me.score}</small></div>
  ${rv?'':`<div class="qbar"><i id="qmbar" style="width:${left/(q.time*10)}%"></i></div>`}
  <div class="box"><div class="row"><small>${QT[q.t]||''}</small>${rv?'':`<b class="q" id="qmt">${Math.ceil(left/1000)}</b>`}</div>
  ${qmImg(q)}<p style="font-size:20px;font-weight:600;line-height:1.5;margin:0 0 12px">${esc(q.text)}</p>
  ${q.opts.map((o,i)=>`<button class="opt g ${rv?(i===QM.rev.ci?'ok':(i===QM.mine?'no':'')):(QM.mine===i?'sel':'')}" ${rv||ans?'disabled':''} onclick="qzAns(${i})">${esc(o)}</button>`).join('')}
  ${rv?'':`<small>${ans?'✅ ส่งคำตอบแล้ว รอเพื่อน… ':''}ตอบแล้ว ${ac}/${on} คน</small>`}</div>
  ${rv?`<div class="box"><b class="${ok?'win':'lose'}">${ok?'✅ ถูกต้อง! +'+me.delta:QM.mine===null?'⏰ คุณไม่ได้ตอบ':'❌ ตอบผิด'}</b><p style="line-height:1.6">${esc(QM.rev.exp)}</p>
   ${QM.owner?`<button class="b" onclick="s.emit('qz:next')">${QM.i+1<QM.n?'ข้อต่อไป ▶':'ดูผลรวม 🏁'}</button>`:''}<small>ไปข้อถัดไปอัตโนมัติใน <span id="qmn">${Math.ceil(QM.rev.nextIn/1000)}</span> วินาที</small></div>`:''}
  ${board(rv)}${leaveBtn}`;return}
 A.innerHTML=`<h2>🏁 จบเกม</h2><div class="box" style="text-align:center"><div class="big" style="font-size:64px">🏆</div><b style="font-size:24px">${esc(rank[0].name)} ชนะ!</b><p>${rank[0].score} คะแนน · ตอบถูก ${rank[0].ok}/${QM.n} ข้อ</p></div>
 ${board(false)}${QM.owner?'<button class="b" onclick="s.emit(\'qz:again\')">🔄 เล่นอีกรอบ (กลับไปล็อบบี้)</button>':'<p style="text-align:center">รอเจ้าของห้องเริ่มรอบใหม่…</p>'}${leaveBtn}`}
if(pqroom)quizHome();
</script></body></html>
