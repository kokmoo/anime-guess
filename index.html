 const k=all[Math.floor(Math.random()*all.length)];g.innerHTML=`<b style="font-size:17px">${esc(qOf(k))}</b><div class="row"><button class="g" onclick="useQ('${k}','chat')">💬 ส่งเข้าแชท</button><button class="g" onclick="useQ('${k}','note')">📝 จดโน้ต</button></div>`}
const hlite=(n,q)=>n.toLowerCase().startsWith(q)?`<mark>${esc(n.slice(0,q.length))}</mark>${esc(n.slice(q.length))}`:esc(n);

 if(!q){l.innerHTML='';return}
 if(hard&&q.length<3){l.innerHTML='<small>😈 โหมดยาก: พิมพ์อย่างน้อย 3 ตัวอักษรถึงจะมีตัวช่วย</small>';return}
 const sc=[];chars.forEach(c=>{const n=c[0].toLowerCase(),al=(c[3]||'').toLowerCase().split('|').filter(Boolean);
  const s=n.startsWith(q)?0:al.some(a=>a.startsWith(q))?1:n.split(/[\s().\-:]+/).some(w=>w.startsWith(q))?2:(q.length>=2&&(n.includes(q)||al.some(a=>a.includes(q))))?3:9;if(s<9)sc.push([s,c])});
 sc.sort((a,b)=>a[0]-b[0]||a[1][0].localeCompare(b[1][0]));sgList=sc.slice(0,hard?4:30).map(x=>x[1]);
 l.innerHTML=sgList.length?sgList.map((c,k)=>`<div class="sg" id="sg${k}" onmousedown="event.preventDefault()" onclick="pickSg(${k})">${!hard&&c[2]?`<img src="/img/${c[2]}.jpg" alt="" loading="lazy">`:''}<span><b>${hlite(c[0],q)}</b>${hard?'':`<small>${esc(c[1])}</small>`}</span></div>`).join(''):'<small>ไม่พบชื่อที่ตรงกัน ลองพิมพ์ตัวอักษรอื่นดู</small>';if(q===sgQ)l.scrollTop=sgTop;else{sgQ=q;sgTop=0}}

function sgKey(e){if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!sgList.length)return;e.preventDefault();sgSel=(sgSel+(e.key==='ArrowDown'?1:-1)+sgList.length)%sgList.length;sgList.forEach((_,k)=>{const d=$('sg'+k);if(d)d.classList.toggle('on',k===sgSel)});const d=$('sg'+sgSel);if(d)d.scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter'){e.preventDefault();if(sgSel>=0)pickSg(sgSel);else sendGuess()}else if(e.key==='Escape'){$('gsl').innerHTML='';sgList=[]}}

const getTok=()=>{try{return localStorage.tok||''}catch(e){return ''}};
function accSave(){if(!ACC)return;accDirty=true;clearTimeout(accTimer);accTimer=setTimeout(accFlush,1500)}
function accFlush(){if(!ACC||accBusy||!accDirty)return;accBusy=true;accDirty=false;s.emit('auth:save',{prof:PF,base:ACC.v});setTimeout(()=>{accBusy=false},8000)}
function accSync(){return new Promise(r=>{if(!ACC||(!accDirty&&!accBusy))return r();accBusy=false;accDirty=true;let T;const done=()=>{clearTimeout(T);s.off('auth:saved',done);s.off('auth:stale',done);r()};T=setTimeout(done,4000);s.once('auth:saved',done);s.once('auth:stale',done);accFlush()})}
function srvCall(ev,data,okEv,errEv){return new Promise((res,rej)=>{let T;const off=()=>{clearTimeout(T);s.off(okEv,ok);s.off(errEv,er)};const ok=d=>{off();res(d)},er=m=>{off();rej(m)};T=setTimeout(()=>{off();rej('เซิร์ฟเวอร์ไม่ตอบสนอง ลองใหม่')},12000);s.on(okEv,ok);s.on(errEv,er);s.emit(ev,Object.assign({base:ACC.v},data))})}

s.on('auth:ok',d=>{try{localStorage.tok=d.tok}catch(e){}
 const same=ACC&&ACC.name===d.name&&ACC.v===d.v;ACC={name:d.name,v:d.v};
 if(!same){accApply(d.prof);if(!name){name=d.name;try{localStorage.name=name}catch(e){}}syncProf();flash('☁️ เข้าสู่ระบบ: '+d.name)}else if(accDirty)accFlush();
 if($('set').style.display==='flex'&&pTab==='me')openProf('me');if(!st&&!QM)render()});
s.on('auth:saved',d=>{if(ACC)ACC.v=d.v;accBusy=false;if(d.prof&&(d.prof.coins!==PF.coins||d.prof.xp!==PF.xp)&&!accDirty){accApply(d.prof);syncProf()}if(accDirty)accFlush()});
s.on('auth:stale',d=>{if(!ACC)return;ACC.v=d.v;accBusy=false;accDirty=false;accApply(d.prof);syncProf();flash('🔄 ซิงก์ข้อมูลล่าสุดจากบัญชีแล้ว');if($('set').style.display==='flex')openProf(pTab)});
s.on('auth:bad',()=>{try{localStorage.removeItem('tok')}catch(e){}ACC=null});

 if(ACC)return `<div class="box">☁️ <b>บัญชี: ${esc(ACC.name)}</b><br><small>เหรียญ กรอบ และเลเวลบันทึกอัตโนมัติ เข้าจากเครื่องไหนก็ใช้ชื่อบัญชีกับ PIN เดิมได้</small><button class="g" onclick="accLogout()">ออกจากระบบ</button></div>`;
 return `<div class="box"><b>☁️ บัญชีผู้เล่น</b> <small>(ยังไม่ได้ล็อกอิน)</small><br><small>ล็อกอินเพื่อเก็บเหรียญ กรอบที่สุ่มได้ และเลเวลไว้ถาวร ใช้ข้ามเครื่องได้ ไม่ต้องใช้อีเมล · จำ PIN ไว้ให้ดี ลืมแล้วกู้คืนไม่ได้</small>
  <input id="an" maxlength="16" placeholder="ชื่อบัญชี (3-16 ตัว)" autocomplete="username"><input id="ap" type="password" maxlength="32" placeholder="PIN (4 ตัวขึ้นไป)" autocomplete="current-password">
  <button class="b" onclick="accReg()">✨ สมัคร (เก็บข้อมูลในเครื่องนี้ขึ้นบัญชี)</button><button class="g" onclick="accLogin()">🔑 เข้าสู่ระบบด้วยบัญชีที่มีอยู่</button></div>`}
const accIn=()=>[($('an')||{}).value||'',($('ap')||{}).value||''];

 s.emit('auth:login',{name:n,pin:p})}

 clearTimeout(accTimer);if(accDirty&&ACC)s.emit('auth:save',{prof:PF,base:ACC.v});s.emit('auth:logout');try{localStorage.removeItem('tok')}catch(e){}ACC=null;accDirty=false;accApply({});syncProf();openProf('me');if(!st&&!QM)render()}

// ---- โหมดแฟนพันธุ์แท้ (เล่นคนเดียว) : คำถามอยู่ในไฟล์ quiz.json ----
let QZ=null,QS=null,qTick=0;
const QT={scene:'🎬 ฉาก',char:'🧑 ตัวละคร',quote:'💬 คำพูด'},QLIM=20,QNUM=10;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const qBest=k=>{try{return+(JSON.parse(localStorage.qbest||'{}')[k]||0)}catch(e){return 0}};
const qSave=(k,v)=>{try{const o=JSON.parse(localStorage.qbest||'{}');if(v>(o[k]||0)){o[k]=v;localStorage.qbest=JSON.stringify(o)}}catch(e){}};
const qNames=()=>[...new Set((QZ||[]).map(q=>q.a))];
function quizHome(){mode='quiz';QS=null;clearInterval(qTick);render();if(!QZ)fetch('/quiz.json?v='+VER).then(r=>r.json()).then(j=>{QZ=Array.isArray(j)?j:[];if(mode==='quiz')render()}).catch(()=>{QZ=[];if(mode==='quiz')render()})}
function quizStart(i){
 const a=i<0?'ALL':qNames()[i],pool=QZ.filter(q=>a==='ALL'||q.a===a);if(!pool.length)return;
 QS={a,ai:i,qs:shuf(pool).slice(0,QNUM).map(q=>({...q,o:shuf([q.c,...q.w])})),i:0,score:0,ok:0,streak:0,picked:null,gain:0,t0:0};
 mode='quizPlay';render();qRun()}
function qRun(){clearInterval(qTick);QS.t0=Date.now();QS.picked=null;
 qTick=setInterval(()=>{if(!QS||mode!=='quizPlay'||QS.picked!==null){clearInterval(qTick);return}
  const left=Math.max(0,QLIM*1000-(Date.now()-QS.t0)),e=$('qt'),b=$('qbar');
  if(e){e.textContent=Math.ceil(left/1000);e.classList.toggle('low',left<=5000)}
  if(left>0&&left<=5000){const c=Math.ceil(left/1000);if(c!==qLast){qLast=c;SFX.urgent(c)}}
  if(b)b.style.width=(left/(QLIM*10))+'%';
  if(left<=0)quizAnswer(-1)},200)}
function quizAnswer(i){
 if(!QS||QS.picked!==null)return;clearInterval(qTick);
 const q=QS.qs[QS.i],ok=i>=0&&q.o[i]===q.c;QS.picked=i;QS.gain=0;
 if(ok){const left=Math.max(0,QLIM*1000-(Date.now()-QS.t0));QS.streak++;QS.gain=100+Math.round(left/(QLIM*1000)*50)+(QS.streak>=3?20:0);QS.score+=QS.gain;QS.ok++;QS.streak>=3?SFX.combo(QS.streak-2):SFX.ding()}
 else{QS.streak=0;SFX.buzz()}
 render()}
function quizNext(){
 if(QS.i+1>=QS.qs.length){mode='quizEnd';qSave(QS.a,QS.score);awardSolo();render();if(QS.ok>=QS.qs.length*.8){confetti();SFX.win()}else SFX.gameover();return}
 QS.i++;QS.picked=null;render();qRun()}
function drawQuiz(A){
 A.className='';document.body.classList.remove('w');
 const back=`<button class="g" onclick="clearInterval(qTick);mode='home';QS=null;render()">← กลับหน้าแรก</button>`;
 if(mode==='quiz'){
  if(!QZ){A.innerHTML=`<h2>🧠 โหมดแฟนพันธุ์แท้</h2><div class="box">กำลังโหลดคำถาม…</div>${back}`;return}
  if(!QZ.length){A.innerHTML=`<h2>🧠 โหมดแฟนพันธุ์แท้</h2><div class="box">โหลดคำถามไม่สำเร็จ ตรวจว่ามีไฟล์ quiz.json อยู่ข้าง index.html</div>${back}`;return}
  const nm=qNames();
  A.innerHTML=`<h2>🧠 โหมดแฟนพันธุ์แท้</h2><div class="box"><p style="margin-top:0;line-height:1.6">ตอบคำถามเกี่ยวกับฉาก ตัวละคร และคำพูดจากอนิเมะที่คุณรัก ข้อละ ${QLIM} วินาที ตอบเร็วได้คะแนนเพิ่ม ตอบถูกติดกันได้โบนัส 🔥</p>
   <div class="acards"><button class="ac all" onclick="quizStart(-1)">🎲 สุ่มจากทุกเรื่อง<br><small>${QZ.length} ข้อ${qBest('ALL')?` · สถิติ ${qBest('ALL')}`:''}</small></button>
   ${nm.map((n,i)=>{const c=QZ.filter(q=>q.a===n).length,b=qBest(n),cv=coverOf(n);return `<button class="ac" onclick="quizStart(${i})">${cv?`<img class="cv" loading="lazy" src="/img/${cv}.jpg" alt="">`:`<div class="cv0">${esc([...n][0])}</div>`}<div class="ct"><b>${esc(n)}</b><small>${c} ข้อ${b?` · สถิติ ${b}`:''}</small></div></button>`}).join('')}</div></div>${mpBox()}${back}`;return}
 if(mode==='quizPlay'&&QS){
  const q=QS.qs[QS.i],done=QS.picked!==null,ok=done&&QS.picked>=0&&q.o[QS.picked]===q.c;
  A.innerHTML=`<div class="row"><b>${QS.a==='ALL'?'ทุกเรื่อง':esc(QS.a)}</b><small>ข้อ ${QS.i+1}/${QS.qs.length} · ⭐ ${QS.score}${QS.streak>=2?` · 🔥x${QS.streak}`:''}</small></div>
  <div class="qbar"><i id="qbar" style="width:${done?0:100}%"></i></div>
  <div class="box"><div class="row"><small>${QT[q.t]||''} · ${esc(q.a)}</small><b class="q" id="qt">${done?'':QLIM}</b></div>
  ${qmImg(q)}<p class="qtext">${esc(q.q)}</p>
  ${q.o.map((o,i)=>`<button class="opt g ${done?(o===q.c?'ok':(i===QS.picked?'no':'')):''}" ${done?'disabled':''} onclick="quizAnswer(${i})"><span class="ltr">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  ${done?`<div class="box"><b class="${ok?'win':'lose'}">${ok?'✅ ถูกต้อง! +'+QS.gain:QS.picked<0?'⏰ หมดเวลา':'❌ ตอบผิด'}</b><p style="line-height:1.6">${esc(q.e||'')}</p><button class="b" onclick="quizNext()">${QS.i+1<QS.qs.length?'ข้อต่อไป ▶':'ดูผลคะแนน 🏁'}</button></div>`:''}${back}`;return}
 if(mode==='quizEnd'&&QS){
  const n=QS.qs.length,p=QS.ok/n,rank=p===1?'👑 แฟนพันธุ์แท้ตัวจริง':p>=.8?'🔥 แฟนตัวยง':p>=.5?'🙂 แฟนทั่วไป':'🌱 แฟนมือใหม่';
  A.innerHTML=`<h2>🏁 สรุปผล — ${QS.a==='ALL'?'ทุกเรื่อง':esc(QS.a)}</h2><div class="box" style="text-align:center"><div class="big" style="font-size:72px">${QS.ok}/${n}</div><b style="font-size:24px">${rank}</b><p>คะแนนรวม ⭐ ${QS.score} · สถิติสูงสุด ${qBest(QS.a)}</p></div>
  <button class="b" onclick="quizStart(${QS.ai})">🔄 เล่นอีกครั้ง</button><button class="g" onclick="quizHome()">📚 เลือกเรื่องอื่น</button>${back}`;return}
 mode='quiz';drawQuiz(A)}

function drawQM(A){

 if(QM.phase==='lobby'){
